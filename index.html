<script type="text/plain" id="terms">NAV|One slice of a big pizza: total pizza value divided by number of slices.|Net Asset Value|The price of one unit of a mutual fund: (what the fund owns minus what it owes) divided by its units. Updated once a day.
Mutual fund|A shared tiffin: many people chip in, one cook chooses the food.||A pool of money from many investors, run by a professional manager who spreads it across many stocks or bonds.
SIP|A small fixed amount every month, like a recurring chit.|Systematic Investment Plan|Investing a fixed amount at regular intervals (say ₹500 a month) into a fund, so you buy steadily instead of guessing a perfect day.
Volatility|How wildly a pot of milk bubbles up and down.||How much and how fast a price swings up and down. High volatility means bigger surprises in both directions.
Diversification|Not keeping all eggs in one basket.||Spreading money across different things so one bad outcome does not sink everything.
Compounding|A snowball gathering more snow as it rolls.||Earning returns on your earlier returns, so growth speeds up the longer money stays invested.
Expense ratio|The cook's yearly fee taken from the shared tiffin.||The yearly fee, as a % of your money, that a fund charges to run itself. It is deducted quietly from the NAV.
Exit load|A fee for leaving the chit before time.||A fee charged if you take money out of a fund before a stated period ends.
Demat account|A locker that keeps your shares electronically.|Dematerialised account|An account that holds your shares and bonds in electronic form, like a bank account for securities.
Stock|A tiny ownership slice of a company.||A unit of ownership in a company. Owning one makes you a (very small) part-owner.
Share price|What buyers pay today for one slice of a company.||The price at which a share last changed hands between a buyer and a seller.
Dividend|Fruit from a mango tree: a company sharing some profit with owners.||A share of a company's profit paid out to its shareholders. Companies are not obliged to pay one.
Bonus shares|Pizza cut into more slices; you hold more slices, same pizza.||Free extra shares given to existing shareholders from the company's reserves. Total value stays the same, spread over more shares.
Stock split|One big roti torn into smaller pieces; same roti.||A company divides each share into several shares at a proportionally lower price. Your total value does not change.
Buyback|A shop taking back its own coupons.||A company buys its own shares from the market, which reduces the number of shares outstanding.
Index|A class average that sums up a basket of big companies.||A number that tracks a basket of stocks to show how the market or a sector is doing, e.g. Nifty 50 or Sensex.
Bull market|A festival crowd: prices rising for a long stretch.||A long stretch where prices are mostly rising and confidence is high.
Bear market|Hibernation: prices sliding for a long stretch.||A long stretch where prices are mostly falling (usually 20% or more from a peak) and mood is gloomy.
Market cap|Price of the whole shop: share price times number of shares.|Market capitalisation|The market's price tag for a whole company: share price × number of shares.
Liquidity|How fast you can turn something into cash: vegetables fast, a house slow.||How quickly you can turn something into cash without losing much value.
Risk|The chance that monsoon spoils your harvest.||The chance that an outcome is worse than you hoped, including losing some or all of your money.
Risk appetite|How much spice you can handle without getting sick.||How much ups and downs you can handle, financially and emotionally, without panicking.
Inflation|Your ₹100 buying fewer samosas each year.||The general rise in prices over time, which reduces what each rupee can buy.
Fixed deposit|Lending the bank money for a promised interest.||Money you lend to a bank for a fixed period at a promised interest rate.
Interest|Rent paid for using someone else's money.||The price of using money: paid to you when you lend or save, paid by you when you borrow.
Leverage|Lifting a heavy load with a borrowed crane: gains and slips both get bigger.||Using borrowed money to take a bigger position. Gains and losses both get magnified.
Margin call|The lender asking you to add money because your borrowed bet is falling.||A demand from your broker or lender to add money because your borrowed position has lost value. If you cannot, they can sell it.
F&O|A coupon with a deadline: SEBI found 9 in 10 individual traders lost money.|Futures and Options|Contracts whose value comes from another asset. They are leveraged and complex, and most individual traders lose money.
Stop-loss|A seat belt fitted before the drive, not during the crash.||A rule, set in advance, to exit a position if the price falls to a chosen level, so one loss does not run away.
Intraday|A day vendor who must clear all stock by evening.||Buying and selling the same share within one trading day, without taking delivery.
Circuit breaker|A fuse that trips when swings get too wild, giving everyone a pause.||An automatic pause in trading when prices move too far too fast, giving everyone time to think.
IPO|A new shop's opening-day sale of ownership slices.|Initial Public Offering|The first time a company sells its shares to the public to raise money.
SEBI|The market's traffic police and rulebook.|Securities and Exchange Board of India|India's market regulator. It writes the rules and registers brokers, advisers and funds.
NSDL|The record-keeper of electronic share lockers.|National Securities Depository Limited|One of India's two depositories (with CDSL) that keep records of electronic shares.
Depository|A bank-like keeper of your electronic shares.||An institution that holds securities electronically on behalf of investors, through your Demat account.
Broker|A mandi agent who carries your order to the market.||A registered middleman that carries your buy and sell orders to the exchange and charges for it.
Nominee|The person you name to get the house keys after you.||The person you name to receive your investments if something happens to you. Setting one is free.
SCORES|A free public complaint window run by SEBI.|SEBI Complaints Redress System|SEBI's free online portal for complaints against listed companies and intermediaries.
KYC|Showing ID once so no one can fake your identity.|Know Your Customer|A one-time identity and address check that financial firms must do before opening an account.
Ponzi scheme|A chit that pays old members with new members' money until it collapses.||A fraud that pays early investors with new investors' money and collapses when new money stops.
Pump and dump|A gang hypes a cheap slice, then sells to you at the top.||A group hypes a cheap share to push the price up, then sells to the people who rushed in.
Phishing|Fake bait messages to steal your passwords and OTPs.||Fake messages, calls or sites that trick you into giving passwords, OTPs or card details.
Finfluencer|A social media advice-giver: check if they are registered before trusting.|Finance influencer|A social-media personality who talks about money. Only SEBI-registered advisers may give investment advice.
Guaranteed returns|A promise of guaranteed rain: nobody honest can give it.||A promise of fixed profit on market investments. Genuine market investments cannot guarantee returns, so it is a red flag.
Rebalancing|Tidying your plate back to the planned portions.||Adjusting your holdings back to your planned mix after prices have pushed them off target.
Asset allocation|How you split your plate between roti, dal and sabzi.||How you divide money between asset types such as stocks, bonds, gold and cash.
Emergency fund|A rainy-day pot kept away from the market.||Money set aside, in a safe and easily reachable place, to cover surprises such as a job loss or medical bill.
FOMO|Rushing into a sale queue because everyone else is.|Fear Of Missing Out|The urge to jump into something because others seem to be gaining from it.
Herd behaviour|Following the crowd without checking where it goes.||Copying what the crowd does instead of thinking independently.
Time horizon|The length of your journey before you need the money.||How long you can leave money invested before you need it. It shapes how much risk makes sense.
Gap down|The shop opens at a much lower price than it closed.||A share opens much lower than its previous close, skipping prices in between.
Gap up|The shop opens at a much higher price than it closed.||A share opens much higher than its previous close, skipping prices in between.
OTP|A one-time key that is only yours; no honest person asks for it.|One-Time Password|A short code sent to you to confirm one action. Sharing it lets someone else act as you.
Remote access app|Handing a stranger your house keys and your diary.||Software (like screen-sharing apps) that lets another person see or control your phone or computer.
Contract note|The bill you get after every market trade.||The official record of a trade your broker sends after each transaction, with price, quantity and charges.
Grievance|A formal complaint, best written with dates and proofs.||A formal complaint. Keep dates, screenshots and reference numbers.
LTP|The last price a vegetable seller agreed on with a customer.|Last Traded Price|The price of the most recent trade. It is the big flickering number on every trading screen.
Bid|A customer's latest offer while haggling.||The highest price a buyer is currently willing to pay for a share.
Ask|The shopkeeper's asking price.||The lowest price a seller is currently willing to accept for a share.
Spread|A money-changer buying dollars cheaper than he sells them.||The gap between the best bid and the best ask. It is a hidden cost: buy at the ask, sell at the bid.
Volume|Footfall in a market: busy lanes versus empty ones.||The number of shares traded so far. High volume means many people are active in that share.
OHLC|A day's story: first sale, best sale, worst sale, last sale.|Open, High, Low, Close|The four prices that build a candle: first price, highest, lowest and last in that period.
Candlestick|A one-day report card drawn as a small candle.||A chart symbol for one time period. The body shows open to close, thin lines show the high and low. Green closed higher; red closed lower.
SMA|Your average of the last five exam scores instead of just the latest.|Simple Moving Average|The average of the last few closing prices, redrawn each candle. It smooths out noise to show direction.
Market order|Buying vegetables at whatever price they are today.||Buy or sell right now at the best available price. Fast, but the exact price is not fixed.
Limit order|Telling the seller: I will pay ₹40 and not a rupee more.||Buy or sell only at your price or better. You control the price but it may never fill.
SL order|An alarm that sells for you if the price drops to your line.|Stop-loss order|A sell order that wakes up when the price falls to your trigger price, then sells at the market.
Quantity|How many kilos you are buying.||The number of shares in your order.
Average price|The average price per kilo after several shopping trips.||What you paid per share on average across all your purchases, including charges.
P&L|The gain or loss on your shop's stock if you sold it today.|Profit and Loss|Current value minus what you paid. It stays on paper (unrealised) until you sell.
Market depth|The queue of buyers and sellers lined up at a counter.||The list of best bids and asks with quantities. It shows how many people want to buy or sell near today's price.
Brokerage|The mandi agent's commission.||The fee your broker charges per trade, plus government taxes and exchange charges.
Slippage|The price on the board changes while you are at the counter.||The difference between the price you expected and the price you actually got, common in fast moves.
Day change|Today's thermometer reading compared with yesterday's.||How much the price has moved since yesterday's closing price, in rupees and in %.</script>

const P=SY.map(s=>s[1]),O=[...P],CS=SY.map(()=>[]),DH=[...P],DL=[...P],VOL=SY.map(()=>0);
function cnd(i){const a=CS[i],o=a.length?a[a.length-1].c:P[i],c=o*(1+(Math.random()-.5)*SY[i][3]),h=Math.max(o,c)*(1+Math.random()*.003),l=Math.min(o,c)*(1-Math.random()*.003),v=Math.round(R(800,3000)*(1+Math.abs(c/o-1)*150));P[i]=c;DH[i]=Math.max(DH[i],h);DL[i]=Math.min(DL[i],l);VOL[i]+=v;a.push({o,c,h,l,v});if(a.length>40)a.shift()}
SY.forEach((s,i)=>{for(let k=0;k<40;k++)cnd(i);O[i]=P[i];DH[i]=DL[i]=P[i];VOL[i]=0});
const pc=i=>((P[i]/O[i]-1)*100).toFixed(2),inr=n=>'₹'+(+n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),spr=i=>Math.max(.05,+(P[i]*.0006).toFixed(2)),bid=i=>P[i]-spr(i)/2,askp=i=>P[i]+spr(i)/2,tz=i=>P[i]>1000?.5:.05,fee=v=>Math.min(20,v*.0003)+v*.0005,hv=()=>Object.keys(S.hold).reduce((s,k)=>s+S.hold[k].q*P[k],0);

function chart(i){const a=CS[i],W=600,H=235,ph=185,mx=Math.max(...a.map(x=>x.h)),mn=Math.min(...a.map(x=>x.l)),y=v=>8+(mx-v)/(mx-mn||1)*(ph-16),vm=Math.max(...a.map(x=>x.v)),st=(W-46)/a.length,col=k=>k.c>=k.o?'var(--g)':'var(--r)';
const pts=a.map((_,k)=>k<4?'':`${k*st+st/2},${y(a.slice(k-4,k+1).reduce((s,x)=>s+x.c,0)/5)}`).filter(Boolean).join(' '),ly=y(P[i]);
const grid=[0,1,2,3].map(g=>{const v=mx-(mx-mn)*g/3;return`<line x1="0" x2="${W-46}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${W-42}" y="${y(v)+4}" fill="var(--mu)" font-size="10">${v.toFixed(1)}</text>`}).join('');
return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Candlestick chart of ${SY[i][0]} with volume bars">${grid}${a.map((k,j)=>{const x=j*st+st/2,vh=k.v/vm*38;return`<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${col(k)}"/><rect x="${x-st*.32}" width="${st*.64}" y="${Math.min(y(k.o),y(k.c))}" height="${Math.max(2,Math.abs(y(k.o)-y(k.c)))}" fill="${col(k)}"/><rect x="${x-st*.32}" width="${st*.64}" y="${H-vh-2}" height="${vh}" fill="${col(k)}" opacity=".4"/>`}).join('')}<polyline points="${pts}" fill="none" stroke="var(--a)" stroke-width="1.6"/><line x1="0" x2="${W-46}" y1="${ly}" y2="${ly}" stroke="var(--p)" stroke-dasharray="4 3"/><rect x="${W-46}" y="${ly-8}" width="46" height="16" rx="4" fill="var(--p)"/><text x="${W-43}" y="${ly+4}" fill="#fff" font-size="10">${P[i].toFixed(1)}</text></svg>`}
function qt(i){const u=P[i]>=O[i],c=u?'up':'dn';return`<div class="row" style="border:0"><div><b style="font-size:18px">${SY[i][0]}</b> <span class="chip">${SY[i][2]}</span></div><div style="text-align:right"><span class="big ${c}">${P[i].toFixed(2)}</span><br><span class="${c}">${u?'▲':'▼'} ${Math.abs(P[i]-O[i]).toFixed(2)} (${pc(i)}%) ${J('Day change','today')}</span></div></div><div class="kv">${[['LTP','LTP',P[i].toFixed(2)],['Day change','Prev close',O[i].toFixed(2)],['OHLC','High / Low',DH[i].toFixed(1)+' / '+DL[i].toFixed(1)],['Volume','Volume',VOL[i].toLocaleString('en-IN')],['Bid','Bid',bid(i).toFixed(2)],['Ask','Ask',askp(i).toFixed(2)]].map(([n,l,v])=>`<span>${J(n,l)}<b>${v}</b></span>`).join('')}</div>`}

function wl(){return SY.map((s,i)=>{const u=P[i]>=O[i];return`<div class="wr ${TK.i==i?'sel':''}"><button class="wn" onclick="pick(${i})">${s[0]}</button>${spark(i)}<span class="${u?'up':'dn'}">${P[i].toFixed(2)}<br><small>${u?'+':''}${pc(i)}%</small></span><button onclick="why(${i})" aria-expanded="${WY==i}">Why?</button></div>${WY==i?`<div class="why">${whyH(i)}</div>`:''}`}).join('')}

function exec(i,sd,q,px,ty,pend){const v=q*px,f=fee(v);if(sd=='B'){if(v+f>S.cash){say('Not enough practice cash for that order. Lower the quantity.','dn');return false}const h=S.hold[i]||{q:0,avg:0};h.avg=(h.avg*h.q+v+f)/(h.q+q);h.q+=q;S.hold[i]=h;S.cash-=v+f}else{const h=S.hold[i];h.q-=q;S.cash+=v-f;if(!h.q)delete S.hold[i]}

function scamCheck(q){const f=flagsOf(q),lv=f.length>=4?'🔴 Very likely a scam':f.length>=2?'🟠 Suspicious':f.length?'🟡 Be careful':'🟢 No classic red flags found';return`**${lv}**\n${f.length?'Red flags spotted:\n• '+f.join('\n• ')+'\n':''}Safest move: do not click, pay or share codes. Open your official app by typing its address yourself, or call the number printed on the official website. If money is lost, call 1930 (cyber fraud helpline) or complain at cybercrime.gov.in; for market complaints use SEBI SCORES. No tool is 100% sure, so when in doubt, verify.`}
function fnd(l){const out=[],names=[...TERMS.map(t=>t[0]),...Object.keys(ALI)].sort((a,b)=>b.length-a.length);let r=' '+l.replace(/[?.,!]/g,' ')+' ';for(const n of names){const k=' '+n.toLowerCase()+' ';if(r.includes(k)){const t=ALI[n]!==undefined?ALI[n]:TERMS.find(x=>x[0]==n)?.[0];if(t)out.push(t);r=r.replace(k,' ')}}return[...new Set(out)]}

function bot(t){const l=$('#log'),pl=t.replace(/<[^>]+>/g,'').replace(/'/g,' ');l.insertAdjacentHTML('beforeend',`<p>${t} <a href="#" onclick="speak(decodeURIComponent('${encodeURIComponent(pl).replace(/'/g,'%27')}'));return false" aria-label="Listen">🔊</a></p>`);if(S.vf)speak(pl,AI.url?VL[S.lang]:'en-IN');l.scrollTop=1e9}

async function llm(q){try{const r=await fetch(AI.url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:AI.key},body:JSON.stringify({question:q,screen:S.tab,symbol:SY[TK.i][0],lang:S.lang,rules:'Educational only. Never give buy, sell or hold advice and never predict prices.'})});return(await r.json()).answer||''}catch(e){return''}}
async function ask(q0){const i=$('#aq'),q=(typeof q0=='string'?q0:i.value).trim();if(!q)return;i.value='';const lg=$('#log');lg.insertAdjacentHTML('beforeend',`<p class="u">${q.replace(/</g,'&lt;')}</p><p class="ty" id="ty">Arthodaya is thinking…</p>`);lg.scrollTop=1e9;await new Promise(r=>setTimeout(r,350));const r=await reply(q);$('#ty')?.remove();bot(await bhashini(md(r),S.lang)+' <i class="mu">Practice only, not advice.</i>')}
async function reply(q){if(AI.url&&S.lang!='en'){const a=await llm(q);if(a)return a.replace(/</g,'&lt;')}const l=q.toLowerCase(),ts=fnd(l),fl=flagsOf(q);
if(/^(hi|hello|hey|hii|namaste)\b/.test(l))return'Namaste! I can explain a money word, a chart, an order type, or check a suspicious message. Tap a suggestion below or type your question.';
if(!/scam|otp|message|link|panic/.test(l)&&/(should i|which (stock|share)s?|best (stock|share)s?|what (stock|share)s? .*(buy|sell)|what to (buy|sell)|stock tips?|target price|will .* (go up|rise|fall|crash)|is .* (a )?good (buy|stock|investment))/.test(l))return'I can’t give stock tips or buy, sell or hold advice, and nobody can honestly predict prices. I can explain how risk, fees or order types work, or how to check that an adviser is registered with SEBI.';
if(q.length>45&&(/^check|scam|real or fake|genuine|is this safe/.test(l)||fl.length>=3))return scamCheck(q);
const si=SY.findIndex((s,i)=>i&&l.includes(s[0].toLowerCase().replace(' demo','')));
if(si>0&&/why|move|up|down|fall|fell|rise|rose|drop/.test(l)){const u=P[si]>=O[si],d=WHY[si][u?0:1][0];return`**${SY[si][0]}** is ${u?'up':'down'} ${Math.abs(pc(si))}% from yesterday’s close. In this practice market the invented story is: ${d}. Prices move when more people want to buy than sell (or the reverse). It is random demo data, so it predicts nothing. Open the **Why?** button in the watchlist for a fuller explanation.`}
const nums=(l.match(/\d+(\.\d+)?/g)||[]).map(Number);
if(/sip|monthly|per month/.test(l)&&nums.length>=3){const[a,y,rt]=nums,r=rt/1200,n=y*12,fv=r?a*((Math.pow(1+r,n)-1)/r)*(1+r):a*n;return`**Illustration only:** ₹${a.toLocaleString('en-IN')} a month for ${y} years has you putting in ₹${(a*n).toLocaleString('en-IN')}. At an assumed ${rt}% a year, it would grow to about ₹${Math.round(fv).toLocaleString('en-IN')}. Real returns vary and can be negative, so treat this as arithmetic, not a forecast.`}
if(/why.*(price|move)|why did|volatil|go up and down/.test(l))return'Prices move when many people change their minds about what something is worth. News, fear and rumour can all push them, which is why decisions made in a hurry often go wrong. Tap **Why?** next to any watchlist item for a worked example.';
if(ts.length>=2)return ts.slice(0,3).map(tA).join('\n\n')+(ts.length==2?'\n\nIn short: they are related ideas, so read the plain explanations side by side.':'');
if(ts.length==1)return tA(ts[0]);
if(/this (screen|page|tab)|explain.*(screen|page)|where am i|what can i do here/.test(l))return SCR[S.tab]||SCR.home;
if(/simpler|simple|example|again|more|explain better/.test(l)&&S.last){const t=TERMS.find(x=>x[0]==S.last);return`Think of **${t[0]}** like this: ${t[1]}\nIn one line: ${t[3]}`}
if(/order type|how.*(place|order)|how do i (trade|buy)/.test(l))return'On the order ticket pick **Buy** or **Sell**, then a type: **Market** (now, at the best available price), **Limit** (only at your price or better) or **Stop-loss** (sells for you if the price falls to your trigger). Enter a quantity, check the estimated charges, then place the practice order.';
if(/scam|fraud|otp|guarantee|link|whatsapp|telegram|advisor|adviser|spot/.test(l))return'Paste the message here and I’ll check it for red flags. In general: guaranteed returns, urgency, secrecy, payment to a person’s UPI, requests for OTPs, lookalike links and remote-access apps are warning signs. Pause, then verify on the official app or regulator website.';
if(/chart|ticker|dashboard|watchlist|volume|average/.test(l))return'This dashboard is a simulator with random demo numbers. Green candle: closed above its open; red: below. The orange line is a 5-candle average, the bars at the bottom are volume. Prices here predict nothing about real markets.';
if(/why.*(price|move)|volatil|go up and down|why did/.test(l))return'Prices move when many people change their minds about what something is worth. News, fear and rumour can all push them, which is why decisions made in a hurry often go wrong. Tap **Why?** next to any watchlist item for a worked example.';
if(AI.url){const a=await llm(q);if(a)return a.replace(/</g,'&lt;')}
return'I didn’t quite catch that. Try “what is NAV?”, “difference between SIP and mutual fund”, “explain this screen”, or paste a message to check if it’s a scam. I explain ideas; I never advise what to buy.'}
